[package]
name = "natives"
version = "0.1.0"
description = "Natives — Personal All-in-One AI Workbench Desktop Application"
authors = ["Natives"]
edition = "2021"

[features]
default = ["ghostty-vt"]
ghostty-vt = []
db-tests = []
# Embedded-broker / diagnostic-only paths (credential_broker.rs, daemon_authority.rs,
# lib.rs). Not part of production builds; declared so `cfg(feature="diagnostic")`
# is a recognized condition under `-D warnings` (unexpected_cfgs).
diagnostic = []

[lib]
name = "natives_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "unstable", "test", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
# 类型契约单一来源：从 Rust struct 生成 TypeScript 类型（serde-compat 默认开启，
# 自动跟随 #[serde(rename/rename_all)]）。生成通过 cargo test export_bindings 触发。
ts-rs = "12"
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
walkdir = "2"
notify = "7"
trash = "5"
whoami = "1"
glob = "0.3"
sha2 = "0.10"
aes-gcm = "0.10"
# Build dependencies for portable-pty on macOS
objc = "0.2"
rand = "0.8"
hex = "0.4"
zip = "2"
base64 = "0.22"
open = "5"
tiny_http = "0.12"
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
encoding_rs = "0.8.35"
sysinfo = "0.33"
libc = "0.2"
regex = "1"
lazy_static = "1"
futures-util = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
# W3 P0-07: Host production must not depend on the full Daemon/engine/provider
# implementation crates. agent-core, capability-gateway and provider-adapters
# are test/diagnostic-only from the Host's perspective (the credential broker
# resolver that touches provider types is cfg(test|diagnostic)); they moved to
# [dev-dependencies]. Only the narrow UDS client surface stays in production:
# assistant-protocol (wire types), contract-linter (module lint) and
# natives-agent-daemon (DaemonClient/UdsAuthority/ExecutionAuthority).
assistant-protocol = { path = "../crates/assistant-protocol" }
contract-linter = { path = "../crates/contract-linter" }
natives-agent-daemon = { path = "../src-agent-daemon" }

[dev-dependencies]
tempfile = "3"
# W3 P0-07: engine/provider implementation crates are test-only for the Host.
agent-core = { path = "../crates/agent-core" }
capability-gateway = { path = "../crates/capability-gateway" }
provider-adapters = { path = "../crates/provider-adapters" }
