[package]
name = "natives"
version = "0.1.0"
description = "AI Steam Base — Desktop Application Container"
authors = ["Natives"]
edition = "2021"

[features]
default = ["ghostty-vt"]
ghostty-vt = []
db-tests = []

[lib]
name = "natives_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
walkdir = "2"
notify = "7"
trash = "5"
whoami = "1"
glob = "0.3"
sha2 = "0.10"
aes-gcm = "0.10"
# Build dependencies for portable-pty on macOS
objc = "0.2"
rand = "0.8"
hex = "0.4"
zip = "2"
base64 = "0.22"
open = "5"
tiny_http = "0.12"
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
encoding_rs = "0.8.35"
sysinfo = "0.33"
libc = "0.2"
regex = "1"
lazy_static = "1"
futures-util = "0.3"
async-trait = "0.1"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
agent-core = { path = "../crates/agent-core" }
provider-adapters = { path = "../crates/provider-adapters" }
capability-gateway = { path = "../crates/capability-gateway" }
assistant-protocol = { path = "../crates/assistant-protocol" }
natives-agent-daemon = { path = "../src-agent-daemon" }
