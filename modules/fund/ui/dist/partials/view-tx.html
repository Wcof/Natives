      <!-- 4. 交易流水模块 -->
      <section id="view-tx" hidden>
        <form class="inline-form" id="tx-form">
          <label>账户<input type="text" name="account" value="默认账户" required></label>
          <label>标的代码<input type="text" name="fundCode" placeholder="如 sh600519" required></label>
          <label>类型<select name="type"><option value="BUY">买入 (BUY)</option><option value="SELL">卖出 (SELL)</option></select></label>
          <label>数量/份额<input type="number" step="0.0001" name="quantity" required></label>
          <label>成交单价<input type="number" step="0.0001" name="price" required></label>
          <label>手续费<input type="number" step="0.01" name="fee" value="0.00"></label>
          <label>交易日期<input type="date" name="tradeDate" required></label>
          <button type="submit" class="btn btn-accent">记一笔</button>
        </form>
        <div id="tx-msg" style="margin-bottom:8px"></div>
        <table class="data-table" id="tx-table">
          <thead>
            <tr><th>交易日期</th><th>账户</th><th>标的代码</th><th>类型</th><th class="num">成交数量</th><th class="num">成交价格</th><th class="num">交易金额</th><th class="num">手续费</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
