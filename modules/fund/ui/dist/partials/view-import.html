      <!-- 5. 批量导入模块 -->
      <section id="view-import" hidden>
        <div style="margin-bottom:8px; font-size:12px; color:var(--natives-text-muted);">
          支持粘贴交易流水或期初持仓 CSV：格式包括 账户,代码,类型,数量,价格,日期
        </div>
        <textarea id="import-text" placeholder="账户,代码,类型,数量,价格,日期..."></textarea>
        <div style="margin-top:8px">
          <button class="btn btn-accent" id="import-preview-btn">预览 CSV</button>
          <button class="btn" id="import-commit-btn" disabled>确认提交入账</button>
        </div>
        <div id="import-msg" style="margin-top:6px"></div>
        <table class="data-table" id="import-table" style="margin-top:10px">
          <thead><tr><th>行号</th><th>账户</th><th>标的代码</th><th>类型</th><th class="num">数量</th><th class="num">金额</th><th>校验状态</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
