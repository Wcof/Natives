                        <button type="button" class="sd-c-dot" data-color="#38bdf8" style="background:#38bdf8" title="天蓝" data-i18n-title="fundDetailStockUiBlue" data-i18n-aria-label="fundDetailStockUiBlue"></button>
                        <button type="button" class="sd-c-dot" data-color="#f59e0b" style="background:#f59e0b" title="琥珀金" data-i18n-title="fundDetailStockUiAmber" data-i18n-aria-label="fundDetailStockUiAmber"></button>
                        <button type="button" class="sd-c-dot" data-color="#cdf24b" style="background:#cdf24b" title="Volt绿" data-i18n-title="fundDetailStockUiVoltGreen" data-i18n-aria-label="fundDetailStockUiVoltGreen"></button>
                        <button type="button" class="sd-c-dot" data-color="#ff2d2d" style="background:#ff2d2d" title="看涨红" data-i18n-title="fundDetailStockUiUpRed" data-i18n-aria-label="fundDetailStockUiUpRed"></button>
                        <button type="button" class="sd-c-dot" data-color="#00b35c" style="background:#00b35c" title="看跌绿" data-i18n-title="fundDetailStockUiDownGreen" data-i18n-aria-label="fundDetailStockUiDownGreen"></button>
                        <button type="button" class="sd-c-dot" data-color="#e040fb" style="background:#e040fb" title="紫罗兰" data-i18n-title="fundDetailStockUiViolet" data-i18n-aria-label="fundDetailStockUiViolet"></button>
                        <button type="button" class="sd-c-dot" data-color="#ffffff" style="background:#ffffff" title="纯白" data-i18n-title="fundDetailStockUiWhite" data-i18n-aria-label="fundDetailStockUiWhite"></button>
                      </div>
                    </div>
                    <div class="sd-lep-row">
                      <label><span data-i18n="fundMarketUiLineWidth">线条粗细</span></label>
                      <div class="sd-line-opts" id="sd-lep-widths">
                        <button class="sd-opt-btn" data-width="1.2"><span data-i18n="fundDetailStockUiThinWidth">细(1px)</span></button>
                        <button class="sd-opt-btn active" data-width="2.0"><span data-i18n="fundDetailStockUiMediumWidth">中(2px)</span></button>
                        <button class="sd-opt-btn" data-width="3.5"><span data-i18n="fundDetailStockUiThickWidth">粗(4px)</span></button>
                      </div>
                    </div>
                    <div class="sd-lep-row">
                      <label><span data-i18n="fundMarketUiLineStyle">线条类型</span></label>
                      <div class="sd-line-opts" id="sd-lep-styles">
                        <button class="sd-opt-btn sd-dash-btn active" data-dash="solid" title="实线" data-i18n-title="fundDetailStockUiSolidLine">
                          <svg viewBox="0 0 26 6" aria-hidden="true"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="2"/></svg>
                          <span><span data-i18n="fundDetailStockUiSolidLine">实线</span></span>
                        </button>
                        <button class="sd-opt-btn sd-dash-btn" data-dash="dashed-dense" title="短虚线（间隔密）" data-i18n-title="fundDetailStockUiDenseDashHint">
                          <svg viewBox="0 0 26 6" aria-hidden="true"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg>
                          <span><span data-i18n="fundDetailStockUiDenseDash">短虚线</span></span>
                        </button>
                        <button class="sd-opt-btn sd-dash-btn" data-dash="dashed" title="常规虚线" data-i18n-title="fundDetailStockUiDashHint">
                          <svg viewBox="0 0 26 6" aria-hidden="true"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/></svg>
                          <span><span data-i18n="fundDetailStockUiDash">虚线</span></span>
                        </button>
                        <button class="sd-opt-btn sd-dash-btn" data-dash="dashed-sparse" title="长虚线（间隔疏）" data-i18n-title="fundDetailStockUiSparseDashHint">
                          <svg viewBox="0 0 26 6" aria-hidden="true"><line x1="1" y1="3" x2="25" y2="3" stroke="currentColor" stroke-width="2" stroke-dasharray="7 4"/></svg>
                          <span><span data-i18n="fundDetailStockUiSparseDash">长虚线</span></span>
                        </button>
                      </div>
                    </div>
                    <div class="sd-lep-foot">
                      <button class="btn btn-accent" id="sd-lep-save" style="font-size:var(--natives-fs-secondary);padding:3px 10px;"><span data-i18n="fundDetailStockUiDone">完成</span></button>
                      <button class="btn" id="sd-lep-del" style="font-size:var(--natives-fs-secondary);padding:3px 10px;color:var(--color-up);"><span data-i18n="fundDetailStockUiDeleteLine">删除此线</span></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 拖拽调宽分隔条：拖动调整右侧看板宽度 -->
            <div class="sd-side-resizer" id="sd-side-resizer" role="separator" aria-orientation="vertical" tabindex="0" title="拖动调整看板宽度" data-i18n-title="fundDetailStockUiResizePanelHint"></div>

            <!-- ===== 右侧：1:1 复刻原始 Dashboard 卡片面板（无 AI 模块） ===== -->
            <div class="sd-right-panel">
              <!-- 1. 标的报价卡 -->
              <div class="side-card quote-summary-card">
                <div class="symbol-title-row">
                  <div>
                    <span class="symbol-name" id="sd-dash-name">–</span>
                    <span class="symbol-code" id="sd-dash-code">–</span>
                  </div>
                  <div>
                    <button class="btn" id="sd-btn-dash-fav"><svg class="svg-icon" aria-hidden="true"><use href="#i-star" /></svg><span data-i18n="fundTrendsUi4">自选</span></button>
                  </div>
                </div>
                <div class="price-large-row">
                  <span class="price-large up" id="sd-dash-price">–</span>
                  <span class="up" id="sd-dash-change">–</span>
                </div>
                <!-- 涨跌停与均价辅助速览 -->
                <div class="sd-limit-row" style="display:flex;gap:12px;margin-top:6px;font-size:var(--natives-fs-secondary);color:var(--natives-text-muted);">
                  <span><span data-i18n="fundDetailStockUiLimitUp">涨停:</span> <b class="up" id="sd-limit-up">–</b></span>
                  <span><span data-i18n="fundDetailStockUiLimitDown">跌停:</span> <b class="down" id="sd-limit-down">–</b></span>
                  <span><span data-i18n="fundDetailStockUiAveragePrice">均价:</span> <b id="sd-avg-price">–</b></span>
                </div>
              </div>

              <!-- 2. 公司市值与估值股本卡片（全量展开） -->
              <div class="side-card valuation-card">
                <button type="button" class="side-card-header" aria-expanded="true"><span data-i18n="fundDetailStockUiValuation">市值与估值股本</span><span class="sc-arrow">▼</span></button>
                <div class="metrics-grid">
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiMarketCap100Million">总市值(亿)</span></span><span class="metric-val" id="sd-v-mktcap">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiFreeFloatCap100Million">流通市值(亿)</span></span><span class="metric-val" id="sd-v-circ-mktcap">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiPEDynamic">市盈率(PE动)</span></span><span class="metric-val" id="sd-v-pe">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiPB">市净率(PB)</span></span><span class="metric-val" id="sd-v-pb">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiDividendYield">股息率%</span></span><span class="metric-val" id="sd-v-div">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiFreeFloatShares100Million">流通股本(亿)</span></span><span class="metric-val" id="sd-v-circ-shares">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiShares100Million">总股本(亿)</span></span><span class="metric-val" id="sd-v-total-shares">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiAveragePrice">当日均价</span></span><span class="metric-val" id="sd-v-avg">-</span></div>
                </div>
              </div>

              <!-- 3. 五档盘口 & 深度力量卡片（全量展开） -->
              <div class="side-card depth-card">
                <button type="button" class="side-card-header" aria-expanded="true"><span data-i18n="fundDetailStockUiDepth">五档盘口与深度力量</span><span class="sc-arrow">▼</span></button>
                <div class="depth-grid">
                  <div class="depth-side" id="sd-depth-asks">
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiAsk5">卖五</span></span><span class="num down">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiAsk4">卖四</span></span><span class="num down">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiAsk3">卖三</span></span><span class="num down">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiAsk2">卖二</span></span><span class="num down">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiAsk1">卖一</span></span><span class="num down">-</span><span class="num">-</span></div>
                  </div>
                  <div class="depth-side" id="sd-depth-bids">
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiBid1">买一</span></span><span class="num up">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiBid2">买二</span></span><span class="num up">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiBid3">买三</span></span><span class="num up">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiBid4">买四</span></span><span class="num up">-</span><span class="num">-</span></div>
                    <div class="depth-row"><span class="depth-label"><span data-i18n="fundMarketUiBid5">买五</span></span><span class="num up">-</span><span class="num">-</span></div>
                  </div>
                </div>
                <div class="power-bar-wrap">
                  <div class="power-bar-title">
                    <span><span data-i18n="fundDetailStockUiBids">买盘:</span> <b id="sd-bid-vol-text">0</b></span>
                    <span><span data-i18n="fundDetailStockUiDepthRatio">力量比:</span> <b id="sd-bid-ratio-text">50%</b></span>
                    <span><span data-i18n="fundDetailStockUiAsks">卖盘:</span> <b id="sd-ask-vol-text">0</b></span>
                  </div>
                  <div class="power-bar">
                    <div class="power-bar-fill" id="sd-power-bar-fill" style="width: 50%;"></div>
                  </div>
                </div>
              </div>

              <!-- 4. 核心指标简况网格卡片（全量展开） -->
              <div class="side-card metrics-card">
                <button type="button" class="side-card-header" aria-expanded="true"><span data-i18n="fundMarketUiOrderBookMetrics">盘口关键指标</span><span class="sc-arrow">▼</span></button>
                <div class="metrics-grid">
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundCharthigh">最高</span></span><span class="metric-val" id="sd-m-high">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundChartlow">最低</span></span><span class="metric-val" id="sd-m-low">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiOpen">今开</span></span><span class="metric-val" id="sd-m-open">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiPreviousClose">昨收</span></span><span class="metric-val" id="sd-m-prev">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiTurnover100Million">成交额(亿)</span></span><span class="metric-val" id="sd-m-amount">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiTurnover">换手%</span></span><span class="metric-val" id="sd-m-turnover">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiVolumeRatio">量比</span></span><span class="metric-val" id="sd-m-vol-ratio">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiAmplitude">振幅%</span></span><span class="metric-val" id="sd-m-amplitude">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiOrderImbalance">委比%</span></span><span class="metric-val" id="sd-m-weibi">-</span></div>
                  <div class="metric-box"><span class="metric-label"><span data-i18n="fundMarketUiOrderImbalanceLots">委差(手)</span></span><span class="metric-val" id="sd-m-weicha">-</span></div>
                </div>
              </div>

              <!-- 5. 标的异动预警卡片 -->
              <div class="side-card alert-card">
                <button type="button" class="side-card-header" aria-expanded="true"><span data-i18n="fundDetailStockUiAlerts">标的异动预警 (Alerts)</span><span class="sc-arrow">▼</span></button>
                <div class="alert-body">
                  <div class="alert-controls">
                    <span><span data-i18n="fundDetailStockUiAlertThreshold">涨跌幅突破 ±</span></span>
                    <input type="number" id="sd-alert-threshold" step="0.5" value="3.0">
                    <span>%</span>
                    <button class="btn btn-accent" id="sd-btn-set-alert"><span data-i18n="fundMarketUiSetAlert">设预警</span></button>
                  </div>
                  <div style="font-size:var(--natives-fs-secondary); color: var(--natives-text-muted); margin-top: 6px;">
                    <span data-i18n="fundDetailStockUiStatus">状态:</span> <span id="sd-alert-status" class="up"><span data-i18n="fundMarketUiReady">已就绪</span></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
