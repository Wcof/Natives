[package]
name = "fund-module"
version = "0.1.0"
edition = "2021"
authors = ["Natives"]
description = "Natives official Built-in Fund Module (Library)"
publish = false

[dependencies]
app-runtime-core = { path = "../../crates/app-runtime-core" }
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json", "gzip"] }

[dev-dependencies]
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
