    <dialog id="ws-delete-modal" aria-labelledby="ws-delete-title"><form method="dialog"><h2 id="ws-delete-title" data-i18n="deleteWorkspace">删除空间</h2><p id="ws-delete-message"></p><p class="ws-delete-hint" data-i18n="deleteWorkspaceHint">此操作无法撤销。</p><div class="modal-actions"><button value="cancel" data-i18n="cancel">取消</button><button class="danger" value="default" data-i18n="deleteWorkspace">删除</button></div></form></dialog>
    <dialog id="ws-reset-modal" aria-labelledby="ws-reset-title"><form method="dialog"><h2 id="ws-reset-title" data-i18n="resetWorkspaceTitle">重置空间</h2><p class="ws-reset-description" data-i18n="resetWorkspaceDescription">选择重置后使用的空间模板。当前卡片和背景配置将被替换。</p><div class="ws-reset-options" role="group" data-i18n-aria-label="resetWorkspaceTemplate"><button type="button" data-reset-template="classic" aria-pressed="true"><strong data-i18n="resetTemplateClassic">经典</strong><span data-i18n="resetTemplateClassicDesc">时间、问候语和名言</span></button><button type="button" data-reset-template="focus" aria-pressed="false"><strong data-i18n="resetTemplateFocus">专注</strong><span data-i18n="resetTemplateFocusDesc">时间、待办事项和便签</span></button><button type="button" data-reset-template="blank" aria-pressed="false"><strong data-i18n="resetTemplateBlank">空白</strong><span data-i18n="resetTemplateBlankDesc">不添加任何卡片</span></button></div><div class="modal-actions"><button value="cancel" data-i18n="cancel">取消</button><button class="danger" value="default" data-i18n="confirmResetWorkspace">确认重置</button></div></form></dialog>
    
    <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title">

          <input id="search" type="search" data-i18n-placeholder="search" placeholder="搜索文件" autocomplete="off" aria-describedby="search-hint" aria-keyshortcuts="Meta+K Control+K" />
        </label>
        <span id="search-hint" class="muted" data-i18n="searchHint">使用 content:关键词 搜索文件内容</span>
        <div id="search-results-box" class="search-results-box" style="display:grid;gap:4px;max-height:50vh;overflow-y:auto;margin-top:10px;"></div>
      </form>
    </dialog>
