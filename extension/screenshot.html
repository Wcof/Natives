<!doctype html>
<html lang="zh-CN" data-theme="archive">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="captureTitle">网页截图</title>
    <link rel="stylesheet" href="screenshot.css" />
  </head>
  <body>
    <header class="screenshot-toolbar" id="toolbar">
      <div class="toolbar-brand">
        <h1 class="toolbar-title" data-i18n="captureTitle" id="page-title">网页截图</h1>
        <span class="toolbar-status" id="status-text" data-i18n="captureProgress">正在截取网页...</span>
      </div>
      <div class="toolbar-progress" id="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="toolbar-actions">
        <button type="button" class="btn btn-secondary" id="save-pdf" disabled data-i18n="captureSavePdf">另存为 PDF</button>
        <button type="button" class="btn btn-secondary" id="copy-image" disabled data-i18n="captureCopyImage">复制图片</button>
        <button type="button" class="btn btn-primary" id="save-png" disabled data-i18n="captureSavePng">保存 PNG</button>
      </div>
    </header>

    <div class="toast" id="toast" role="alert" aria-live="polite" hidden></div>
    <div class="error-banner" id="error-banner" role="alert" hidden>
      <span id="error-message"></span>
    </div>

    <main class="screenshot-main">
      <div class="screenshot-container" id="screenshot-container"></div>
    </main>

    <script type="module" src="screenshot.js"></script>
  </body>
</html>
