<!doctype html>
<html lang="zh-CN" data-theme="archive">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="appsCenterTitle">应用中心</title>
    <link rel="stylesheet" href="apps.css" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true" style="display:none">
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5z" /><path d="M3 8l9 5 9-5" /><path d="M12 13v8" /></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" /><rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 17V5" /><path d="m7 10 5-5 5 5" /><path d="M5 21h14" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="M6 7l1 13h10l1-13" /><path d="M9 7V4h6v3" /></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 5h5v5" /><path d="M19 5 10 14" /><path d="M19 13v6H5V5h6" /></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-8 12h6l-1 8 9-13h-6z" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12" /><path d="M18 6 6 18" /></symbol>
    </svg>

    <nav class="apps-nav">
      <div class="brand"><svg class="icon"><use href="#i-bolt" /></svg><span data-i18n="appName">Natives</span></div>
      <button id="nav-center" class="apps-nav-item active" type="button"><svg class="icon"><use href="#i-grid" /></svg><span data-i18n="appsCenter">应用中心</span></button>
      <div class="spacer"></div>
      <button id="nav-back" class="apps-nav-item back" type="button"><svg class="icon"><use href="#i-back" /></svg><span data-i18n="backToSpace">返回</span></button>
    </nav>

    <main class="apps-content">
      <header class="apps-content-head">
        <h1 data-i18n="appsCenterTitle">应用中心</h1>
        <span class="sub" data-i18n="appsCenterSub">管理可选 Natives 应用</span>
      </header>
      <div id="apps-list" class="apps-list" role="list"></div>
    </main>

    <div id="apps-toast" class="apps-toast" role="status" hidden></div>
    <script type="module" src="apps.js"></script>
  </body>
</html>
