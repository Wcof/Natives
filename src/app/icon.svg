<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26375f"/>
      <stop offset="0.48" stop-color="#10172f"/>
      <stop offset="1" stop-color="#090b1c"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd8ff"/>
      <stop offset="0.45" stop-color="#587fff"/>
      <stop offset="1" stop-color="#2834a5"/>
    </linearGradient>
    <linearGradient id="diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68c8ff"/>
      <stop offset="0.48" stop-color="#7484ff"/>
      <stop offset="1" stop-color="#9a5cff"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9098ff"/>
      <stop offset="1" stop-color="#743de5"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9fbff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#87dcff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#6d6cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#030513" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Editable vector approximation of the production icon -->
  <rect x="42" y="42" width="940" height="940" rx="220" fill="url(#bg)"/>
  <rect x="44" y="44" width="936" height="936" rx="218" fill="none" stroke="#78b9ff" stroke-opacity="0.45" stroke-width="6"/>
  <rect x="52" y="52" width="920" height="920" rx="210" fill="none" stroke="#a57cff" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="250" y="236" width="176" height="560" rx="88" fill="url(#left)"/>
    <rect x="598" y="236" width="176" height="560" rx="88" fill="url(#right)"/>
    <path d="M348 314 L686 716" fill="none" stroke="url(#diag)" stroke-width="176" stroke-linecap="round"/>
  </g>

  <circle cx="518" cy="520" r="122" fill="url(#core)" filter="url(#softGlow)" opacity="0.82"/>
  <path d="M289 267 C326 230 385 229 422 265" fill="none" stroke="#c6efff" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>
  <path d="M628 273 C663 238 718 236 752 266" fill="none" stroke="#d7ccff" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round"/>
</svg>
