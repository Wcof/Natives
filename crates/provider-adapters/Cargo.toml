[package]
name = "provider-adapters"
version = "0.1.0"
description = "Natives Provider Adapters — unified interface for LLM providers"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
async-stream = "0.3"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
