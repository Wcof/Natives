[package]
name = "capability-gateway"
version = "0.1.0"
description = "Natives Capability Gateway — tool schemas, policy, sandbox and audit"
edition = "2021"

[dependencies]
assistant-protocol = { path = "../assistant-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
regex = "1"
sha2 = "0.10"
walkdir = "2"