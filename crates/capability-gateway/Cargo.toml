[package]
name = "capability-gateway"
version = "0.1.0"
description = "Natives Capability Gateway — tool schemas, policy, sandbox and audit"
edition = "2021"

[dependencies]
assistant-protocol = { path = "../assistant-protocol" }
# One ruler for drafts and publishes (ADR-0014 invariant #2): the draft tools and
# the host's write_generated_module must run the *same* lint rules.
contract-linter = { path = "../contract-linter" }
# Draft metadata (the revision pointer in particular) is only authoritative in
# natives.db; the daemon reads and advances it directly rather than guessing from
# the directory listing.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
regex = "1"
sha2 = "0.10"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }