[package]
name = "harness-core"
version = "0.1.0"
description = "Natives Harness Core — pure Harness domain model: Hook definitions, provenance, and session coordination"
edition = "2021"

# Pure domain crate. It must not depend on Daemon RPC, SQLite, Renderer, Host,
# Provider adapters, or platform process implementations. See
# docs/superpowers/specs/2026-07-26-native-harness-control-plane-design.md 第 7.1 节。
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
# Canonical hashing for Blueprint versions and Run snapshots. Pure Rust — it
# does not breach the "no platform implementations" rule above.
sha2 = "0.10"
