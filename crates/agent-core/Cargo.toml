[package]
name = "agent-core"
version = "0.1.0"
description = "Natives Agent Core — run state machine, event log, context and orchestration"
edition = "2021"

[dependencies]
assistant-protocol = { path = "../assistant-protocol" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
