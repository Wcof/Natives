[package]
name = "file-manager-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
native-host = []

[dependencies]
dirs = "6"
encoding_rs = "0.8.35"
notify = "7"
open = "5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
walkdir = "2"
