[package]
name = "native-file-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
app-host-support = { path = "../app-host-support" }
base64 = "0.22"
dirs = "6"
ed25519-dalek = "2"
flate2 = "1"
file-manager-core = { path = "../file-manager-core", features = ["native-host"] }
# 生产发布切换 pinned revision（本地开发用 path）。路径从本 crate 出发
# 指向相邻的 Natives-App-Fund 仓库。
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Registry"] }
