[package]
name = "assistant-protocol"
version = "0.1.0"
description = "Natives Assistant Protocol — shared versioned wire and domain types for the Agent Daemon"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"