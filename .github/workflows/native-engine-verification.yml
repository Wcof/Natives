name: Native Engine Verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      live:
        description: "Run provider live smoke tests when repository secrets are available"
        required: false
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATIVES_TEST_OPENAI_KEY: ${{ secrets.NATIVES_TEST_OPENAI_KEY }}
      NATIVES_TEST_OPENAI_BASE: ${{ secrets.NATIVES_TEST_OPENAI_BASE }}
      NATIVES_TEST_ANTHROPIC_KEY: ${{ secrets.NATIVES_TEST_ANTHROPIC_KEY }}
      NATIVES_TEST_ANTHROPIC_BASE: ${{ secrets.NATIVES_TEST_ANTHROPIC_BASE }}
      NATIVES_TEST_MODEL: ${{ vars.NATIVES_TEST_MODEL }}
      NATIVES_TEST_ANTHROPIC_MODEL: ${{ vars.NATIVES_TEST_ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # T002 (P1-015): fail CI when package.json and package-lock.json drift.
      - run: node scripts/check-lockfile-sync.mjs
      - name: Run verification
        run: |
          args=(--scratch "$RUNNER_TEMP/natives-native-engine-verification")
          if [[ "${{ inputs.live || false }}" == "true" ]]; then
            args+=(--live)
          fi
          npm run verify:native-engine -- "${args[@]}"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-verification
          path: ${{ runner.temp }}/natives-native-engine-verification
          if-no-files-found: warn
