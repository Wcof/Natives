name: performance

on:
  pull_request:
  push:
    branches: [main, deploy]

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p native-file-host --release
      - run: npm run perf:check
