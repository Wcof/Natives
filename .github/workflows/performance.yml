name: performance

on:
  pull_request:
  push:
    branches: [main, deploy]

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # T002 (P1-015): fail CI when package.json and package-lock.json drift,
      # and when the installed npm is not the pinned packageManager.
      - run: npm ci
      - run: node scripts/check-lockfile-sync.mjs
      - run: npm run perf:check
