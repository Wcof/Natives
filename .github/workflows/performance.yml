name: performance

on:
  pull_request:
  push:
    branches: [main, deploy]

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cargo build -p native-file-host --release
      # model-host 编译正确性（含 third_party/cliproxyapi 内嵌源码）由 CI 兜底（审计 F-14/D4）
      - run: go build ./...
        working-directory: model-host
      - run: npm run perf:check
