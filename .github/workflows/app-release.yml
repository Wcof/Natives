name: App Release Candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified resource artifacts and the signed catalog
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-catalog-release
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apps/package-demo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: app-package-artifacts
          path: |
            dist/app-release/*.nap
            dist/app-release/catalog-v2.json
          if-no-files-found: error

  catalog:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-package-artifacts
          path: dist/app-release
      - run: node scripts/apps/catalog-signing.mjs dist/app-release/catalog-v2.json
        env:
          NATIVES_CATALOG_SIGNING_KEY: ${{ secrets.NATIVES_CATALOG_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: signed-app-release-candidate
          path: |
            dist/app-release/*.nap
            dist/app-release/catalog-v2.json
            dist/app-release/catalog-v2.sig
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: signed-app-release-candidate
          path: dist/app-release
      - run: node scripts/apps/publish-release.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
