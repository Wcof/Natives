[package]
name = "natives-agent-daemon"
version = "0.1.0"
description = "Natives Agent Daemon — sidecar for authenticated RPC, storage, and agent lifecycle"
edition = "2021"

[dependencies]
assistant-protocol = { path = "../crates/assistant-protocol" }
agent-core = { path = "../crates/agent-core" }
provider-adapters = { path = "../crates/provider-adapters" }
capability-gateway = { path = "../crates/capability-gateway" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
rand = "0.8"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
futures-util = "0.3"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
# Windows Named Pipe support will use tokio's named pipe when stabilized
# For now, we use a transport abstraction