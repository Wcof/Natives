[package]
name = "minimal-agent"
version = "0.1.0"
description = "Minimal external consumer of the agent-core AgentRuntime facade"
edition = "2021"
license = "MIT"
publish = false

# Standalone crate: not a workspace member, so it exercises the public API
# the way an external consumer would.
[workspace]

[dependencies]
agent-core = { path = "../../crates/agent-core" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde_json = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "minimal-agent"
path = "src/main.rs"
